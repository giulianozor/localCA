{{range .Certificates}}
  <tr>
    <td>{{.ID}}</td>
    <td>{{.CommonName}}</td>
    <td>{{range $i, $v := .SANs}}{{if $i}}, {{end}}{{$v}}{{end}}</td>
    <td>{{printf (index $.T "years.value") .ValidityYears}}</td>
    <td>
      <form class="inline-form" method="get" action="/download">
        <input type="hidden" name="kind" value="all-tar-gz">
        <input type="hidden" name="id" value="{{.ID}}">
        <input name="export_passphrase" type="password" placeholder="{{index $.T "cert.list.export_passphrase_placeholder"}}">
        <button type="submit">tar.gz</button>
      </form>
      <form class="inline-form js-delete-cert-form" method="post" action="/certs/delete" data-confirm-text="{{index $.T "cert.delete.confirm"}}">
        <input type="hidden" name="id" value="{{.ID}}">
        <button class="danger" type="submit" aria-label="{{index $.T "cert.list.delete"}} {{.ID}}">{{index $.T "cert.list.delete"}}</button>
      </form>
    </td>
  </tr>
{{else}}
  <tr><td colspan="5" class="muted">{{index .T "cert.list.none"}}</td></tr>
{{end}}
